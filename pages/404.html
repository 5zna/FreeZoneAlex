<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - الصفحة غير موجودة</title>
  <link rel="stylesheet" href="../css/bundle.css">
  <link rel="stylesheet" href="../css/icons.css">
  <style>
    body { background:var(--bg-primary); }
    .error-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:40px 20px; text-align:center; }
    .error-code { font-size:6rem; font-weight:800; color:var(--color-primary); line-height:1; margin-bottom:8px; }
    .error-title { font-size:1.5rem; font-weight:700; margin-bottom:8px; }
    .error-desc { color:var(--text-muted); max-width:400px; margin-bottom:24px; line-height:1.6; }
    .error-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 24px; border-radius:var(--radius-sm); background:var(--color-primary); color:#fff; text-decoration:none; font-weight:600; font-size:0.9rem; transition:opacity var(--transition-fast); }
    .error-btn:hover { opacity:0.85; }
  </style>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch(e) {}
    })();
  </script>

</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title" data-i18n="error_404_title">الصفحة غير موجودة</h1>
    <p class="error-desc" data-i18n="error_404_desc">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
    <a href="/home" class="error-btn" data-i18n="error_404_back">← العودة للرئيسية</a>
  </div>
</body>
</html>
