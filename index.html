<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وظائف المنطقة الحرة بالإسكندرية | FreeZone Jobs Alexandria</title>
  <meta name="description" content="منصة مجتمعية مستقلة لوظائف الإسكندرية والمنطقة الحرة">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    body {
      margin: 0;
      background: #0a0a0f;
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 42%),
        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.1) 0px, transparent 40%);
      color: #f4f4f5;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.95rem; color: #a1a1aa; margin: 0; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
  </div>
  <script>window.location.replace("pages/home.html" + window.location.search + window.location.hash);</script>
</body>
</html>
